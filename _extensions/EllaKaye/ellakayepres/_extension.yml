title: Ella Kaye Presentation
author: Ella Kaye
version: 1.0.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    common:
      knitr:
        opts_chunk:
          warning: false
          message: false
          fig.align: "center"
          fig.show: "hold"
      execute:
        echo: true
        code-overflow: wrap
    revealjs:
      theme: ellakaye.scss
      syntax-highlighting: ellakaye-dark.theme
      slide-number: true
      callout-icon: true
      preview-links: auto
      link-external-newwindow: true
      width: 1280
      height: 720
      keep-md: false
      embed-resources: true